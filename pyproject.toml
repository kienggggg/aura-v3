[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-v3"
version = "0.1.0"
description = "Lập trình bằng thẻ — dựng chương trình Python bằng cách kéo thả, kèm bộ tìm lỗi"
readme = "README.md"
requires-python = ">=3.11"
# Sếp chọn Proprietary ngày 26/08/2026.
#
# BA DẠNG KHAI, THỬ CẢ BA MỚI RA DẠNG CHẠY ĐƯỢC — không đoán:
#
#   license = "Proprietary"                    -> DỰNG KHÔNG ĐƯỢC
#       "must be valid exactly by one definition" — setuptools bản này đòi
#       dạng bảng khi KHÔNG có `license-files`.
#
#   license = { text = "Proprietary" }
#   license-files = ["LICENSE"]                -> DỰNG KHÔNG ĐƯỢC
#       "must be string" — thêm `license-files` là chuyển sang PEP 639, ở đó
#       `license` phải là chuỗi SPDX. Hai lỗi NGƯỢC NHAU tuỳ có dòng kia hay
#       không.
#
#   license = { file = "LICENSE" }             -> dựng được, NHƯNG
#       setuptools nhét NGUYÊN VĂN BẢN giấy phép vào trường `License:` của
#       METADATA. Wheel 234.906 byte, METADATA phình.
#
#   license = "LicenseRef-Proprietary"         <- DẠNG ĐANG DÙNG
#   license-files = ["LICENSE"]
#       PEP 639 cho tiền tố `LicenseRef-` dành riêng cho giấy phép không nằm
#       trong danh mục SPDX. Đo: wheel 233.183 byte, METADATA 6.164 byte,
#       `License-Expression: LicenseRef-Proprietary`, `License-File: LICENSE`,
#       và tệp có thật trong `dist-info/licenses/`.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Phạm Xuân Kiên" }]

# BA GÓI NÀY ĐO BẰNG CÁCH QUÉT `import` THẬT, KHÔNG CHÉP TỪ TÀI LIỆU.
#
# 25/08: lúc viết tệp này, cả `README.md` lẫn `CLAUDE.md` đều ghi ba gói là
# `aiohttp, httpx, pytest`. Sai hai chỗ: `pytest` là gói KIỂM THỬ, không cần
# để chạy app; còn `libcst` — thứ `core/the_cst.py` dùng để mở/sửa/lưu Python
# mà giữ nguyên định dạng — thì bị bỏ sót.
#
# Khai sai ở đây thì cài xong app gãy ngay lần mở tệp đầu tiên. Bắt được bằng
# cách duyệt AST mọi `import` trong `core/`, `interface/`, `aura_chat.py` rồi
# trừ đi thư viện chuẩn.
dependencies = [
    "aiohttp",
    "httpx",
    "libcst==1.9.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
# `aura-the` chạy trong THƯ MỤC DỰ ÁN của người dùng, theo lối `git` / `code .`
aura-the = "interface.the_app:main"
# Tệp `aura_chat.py` ở gốc kho chỉ tái xuất `main` từ `interface.chat_app`,
# nên trỏ thẳng vào đó — khỏi phải đóng gói thêm một mô-đun cấp gốc.
aura-chat = "interface.chat_app:main"

[tool.setuptools]
# Kho này không có `__init__.py` nào — `core` và `interface` là gói ngầm định.
# Liệt kê thẳng ra thay vì để `find` tự đoán, vì `find` sẽ quét trúng cả
# `tests`, `tools`, `experiments`, `data`, `docs` — những thứ KHÔNG thuộc bản
# phát hành.
packages = ["core", "interface"]

[tool.setuptools.package-data]
# Thiếu dòng này thì cài xong KHÔNG CÓ GIAO DIỆN: `index.html`, `app.js`,
# `validator.js`, `style.css` nằm ngoài mã Python nên `pip` bỏ qua chúng.
# Đây là chỗ hỏng lặng lẽ — gói cài được, chạy được, chỉ là trang trắng.
# 26/08: dòng này TỪNG chỉ khai `web/the_v1/*`, và thiếu đúng cái nó cảnh
# báo. `interface/web/chat.html` + `memory.html` nằm NGOÀI `the_v1/` nên không
# vào gói. Hậu quả đo được trên bản cài trong venv sạch: `aura-chat --port 8799`
# khởi động BÌNH THƯỜNG, không in một dòng lỗi nào, rồi
# `GET http://127.0.0.1:8799/` trả **404, 0 byte** — đúng lệnh README bảo người
# dùng gõ. `/memory` cũng 404.
#
# Vì sao lượt kiểm trước không thấy: nó liệt kê tệp trong
# `site-packages/interface/web/the_v1/` — tức đúng thư mục ĐÃ được khai. Kiểm
# trong chỗ mình vừa khai thì bao giờ cũng thấy đủ. Phải đối chiếu với thư mục
# NGUỒN: `find interface/web -type f` ra 6 tệp, wheel có 4.
interface = ["web/the_v1/*", "web/*.html"]
