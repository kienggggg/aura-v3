[pytest]
# Suite mặc định chỉ là test sản phẩm. Test lab/evidence phải được gọi rõ bằng
# đường dẫn và TARGET_RUN_ID, không được làm `pytest` toàn kho đỏ vì thiếu artifact.
testpaths = tests
pythonpath = .
markers =
    slow: bai chay lau (dung video that, ~6 giay)
    timing: test khang dinh ve THOI GIAN THUC — ket qua phu thuoc may co ban hay khong.
        Chay khi may ranh; may ban thi bo qua bang: -m "not timing"
    e1_control: test dieu khien, spawn lifecycle hoac runner E1 cua App The — bo qua trong regression candidate bang -m "not e1_control"

